[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-lang"
version = "0.1.0"
description = "An experimental general-purpose programming language"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nova contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
nova = "nova.cli:main"

[tool.setuptools]
packages = ["nova"]
